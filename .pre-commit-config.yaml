# Pre-commit hooks
repos:
# Execute external scripts
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: check-toml
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
# Execute local scripts
-   repo: local
    hooks:
    -   id: run-formatters
        name: Run Formatters
        entry: poetry run formatters
        language: system
        pass_filenames: false
    -   id: run-linters
        name: Run Linters
        entry: poetry run linters
        language: system
        pass_filenames: false
